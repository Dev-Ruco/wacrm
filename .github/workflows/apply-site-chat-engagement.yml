name: Apply site chat engagement

on:
  push:
    branches:
      - feat/site-chat-engagement

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/site-chat-engagement
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Web Push dependencies
        run: |
          npm install web-push --save
          npm install @types/web-push --save-dev
      - name: Apply integration patch
        run: python .github/scripts/apply-site-chat-engagement.py
      - name: Commit generated changes
        run: |
          git config user.name "Felisberto Ruco"
          git config user.email "felisberto.ruco10@gmail.com"
          git add package.json package-lock.json \
            src/app/api/site-chat/route.ts \
            src/app/api/site-chat/media/route.ts \
            src/app/api/whatsapp/send/route.ts \
            src/lib/flows/meta-send.ts \
            src/lib/ai/tools.ts
          git diff --cached --quiet || git commit -m "feat: ligar OTP, actividade e recuperação ao chat do site"
          git push origin HEAD:feat/site-chat-engagement
