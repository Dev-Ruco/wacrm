name: Apply site image grounding

on:
  push:
    branches:
      - fix/site-chat-legacy-product-image

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/site-chat-legacy-product-image
      - name: Apply patch
        run: python .github/scripts/apply-site-image-grounding.py
      - name: Commit AI grounding changes
        run: |
          git config user.name "Felisberto Ruco"
          git config user.email "felisberto.ruco10@gmail.com"
          git add src/lib/ai/auto-reply.ts
          git diff --cached --quiet || git commit -m "fix: priorizar imagem e id do produto do site na IA"
          git push origin HEAD:fix/site-chat-legacy-product-image
