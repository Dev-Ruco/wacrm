name: Add testing-library DOM peer

on:
  push:
    branches:
      - feat/site-chat-engagement

permissions:
  contents: write

jobs:
  dependency:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/site-chat-engagement
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --save-dev @testing-library/dom
      - name: Commit dependency
        run: |
          git config user.name "Felisberto Ruco"
          git config user.email "felisberto.ruco10@gmail.com"
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "chore: adicionar peer DOM para testes"
          git push origin HEAD:feat/site-chat-engagement
