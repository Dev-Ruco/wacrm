name: Sync and validate site chat engagement

on:
  push:
    branches:
      - feat/site-chat-engagement

permissions:
  contents: write

jobs:
  sync-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/site-chat-engagement
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Sync current main AI tools without losing site activity state
        run: |
          git fetch origin main
          git show origin/main:src/lib/ai/tools.ts > src/lib/ai/tools.ts
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/ai/tools.ts')
          t = p.read_text()
          anchor = "import { createAutoReplyTools as createBaseAutoReplyTools } from './operational-tools'\n"
          if "@/lib/site-chat/activity" not in t:
              t = t.replace(anchor, anchor + "import { setWebsiteActivityIfWebsite } from '@/lib/site-chat/activity'\n", 1)
          anchor = "  const executeTool = async (call: AgentToolCall): Promise<string> => {\n"
          addition = "    if (call.name === 'search_catalog') {\n      await setWebsiteActivityIfWebsite(args.db, args.conversationId, 'searching_catalog').catch((error) =>\n        console.error('[website activity] catalogue state failed:', error),\n      )\n    }\n"
          if "catalogue state failed" not in t:
              t = t.replace(anchor, anchor + addition, 1)
          p.write_text(t)
          PY
          git config user.name "Felisberto Ruco"
          git config user.email "felisberto.ruco10@gmail.com"
          git add src/lib/ai/tools.ts
          git diff --cached --quiet || git commit -m "chore: alinhar chat com melhorias recentes do agente"
          git merge origin/main --no-edit
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Push validated branch
        run: git push origin HEAD:feat/site-chat-engagement
