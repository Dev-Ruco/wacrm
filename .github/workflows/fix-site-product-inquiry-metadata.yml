name: Fix site product inquiry metadata

on:
  push:
    branches:
      - feat/site-chat-product-inquiry

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[product-inquiry-metadata-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/site-chat-product-inquiry
          fetch-depth: 0
      - name: Preserve conversation metadata
        run: python3 .github/scripts/fix-site-product-inquiry-metadata.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/site-chat/route.ts
          git commit -m "fix(chat): preservar metadados da conversa [product-inquiry-metadata-fix]"
          git push origin HEAD:feat/site-chat-product-inquiry
