name: Apply site product inquiry patch

on:
  push:
    branches:
      - feat/site-chat-product-inquiry

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[product-inquiry-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/site-chat-product-inquiry
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/apply-site-product-inquiry.py
      - name: Commit route change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/site-chat/route.ts
          git commit -m "feat(chat): enviar contexto visual do produto [product-inquiry-patch]"
          git push origin HEAD:feat/site-chat-product-inquiry
