name: Apply inbox operating UX

on:
  push:
    branches:
      - feat/inbox-operating-modes-20260816
    paths:
      - scripts/apply-inbox-operating-ux.mjs
      - .github/workflows/apply-inbox-operating-ux.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/inbox-operating-modes-20260816
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Apply inbox UX patch
        run: node scripts/apply-inbox-operating-ux.mjs

      - name: Verify patch is clean
        run: git diff --check

      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/inbox/message-thread.tsx src/components/inbox/message-composer.tsx public/inbox-doodle.svg
          git commit -m "feat(inbox): apply operating mode and composer UX"
          git push origin HEAD:feat/inbox-operating-modes-20260816
