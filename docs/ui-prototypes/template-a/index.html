<title>Commercial Clean</title>
<style>
  :root{
    --navy-950:#0b1622; --navy-900:#0f1f30; --navy-800:#16293d; --navy-700:#1f3752;
    --ink:#101826; --ink-soft:#57657a; --ink-faint:#8695a8;
    --paper:#ffffff; --paper-sunken:#f5f7f9; --paper-recessed:#eef1f4;
    --line:#e2e7ec; --line-strong:#cbd3dc;
    --brand:#1fb855; --brand-hover:#189a47; --brand-soft:#e7f8ec; --brand-ink:#0d6b30;
    --success:#1a9b4d; --warning:#b6740a; --danger:#c53434; --info:#1c6fb8;
    --radius-sm:6px; --radius-md:8px; --radius-lg:12px;
    --shadow-sm:0 1px 2px rgba(16,24,38,.06);
    --shadow-md:0 4px 16px rgba(16,24,38,.08);
    --font: ui-sans-serif,"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
    --font-mono: ui-monospace,"SF Mono","Cascadia Code",Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#eef2f6; --ink-soft:#a7b3c4; --ink-faint:#6b7688;
      --paper:#0d151f; --paper-sunken:#111b27; --paper-recessed:#16212f;
      --line:#233043; --line-strong:#2d3c52;
      --brand-soft:#0f2b1c; --brand-ink:#5fd889;
    }
  }
  :root[data-theme="dark"]{
    --ink:#eef2f6; --ink-soft:#a7b3c4; --ink-faint:#6b7688;
    --paper:#0d151f; --paper-sunken:#111b27; --paper-recessed:#16212f;
    --line:#233043; --line-strong:#2d3c52;
    --brand-soft:#0f2b1c; --brand-ink:#5fd889;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  button{font-family:inherit;}
  .app{display:flex;flex-direction:column;height:100vh;}

  /* ---------- HEADER ---------- */
  header.top{
    background:linear-gradient(180deg,var(--navy-900),var(--navy-950));
    color:#fff; display:flex; align-items:center; gap:20px;
    padding:0 20px; height:56px; flex-shrink:0; position:sticky; top:0; z-index:30;
  }
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;letter-spacing:-.01em;flex-shrink:0;}
  .brand .mark{width:22px;height:22px;border-radius:6px;background:var(--brand);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#06210f;}
  nav.primary{display:flex;align-items:center;gap:2px;height:100%;}
  nav.primary button{
    background:none;border:none;color:rgba(255,255,255,.68);font-size:13px;font-weight:600;
    padding:0 12px;height:100%;cursor:pointer;position:relative;display:flex;align-items:center;gap:6px;
    border-bottom:2px solid transparent;transition:color .12s;
  }
  nav.primary button:hover{color:#fff;}
  nav.primary button.active{color:#fff;border-bottom-color:var(--brand);}
  nav.primary button .dot{width:6px;height:6px;border-radius:50%;background:var(--brand);}
  nav.primary button .pill{background:rgba(255,255,255,.14);color:#fff;font-size:10px;font-weight:700;padding:1px 5px;border-radius:99px;}
  .top-spacer{flex:1;}
  .search{
    display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
    border-radius:var(--radius-md);padding:6px 10px;color:rgba(255,255,255,.55);font-size:12.5px;width:220px;flex-shrink:0;
  }
  .search kbd{margin-left:auto;font-family:var(--font-mono);font-size:10px;background:rgba(255,255,255,.12);padding:1px 5px;border-radius:4px;color:rgba(255,255,255,.6);}
  .icon-btn{width:32px;height:32px;border-radius:var(--radius-md);border:none;background:transparent;color:rgba(255,255,255,.75);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;flex-shrink:0;}
  .icon-btn:hover{background:rgba(255,255,255,.1);color:#fff;}
  .icon-btn .badge{position:absolute;top:3px;right:3px;width:7px;height:7px;background:#ef5350;border-radius:50%;border:1.5px solid var(--navy-950);}
  .btn-new{background:var(--brand);color:#06210f;border:none;font-weight:700;font-size:12.5px;padding:7px 12px;border-radius:var(--radius-md);cursor:pointer;display:flex;align-items:center;gap:6px;flex-shrink:0;}
  .btn-new:hover{background:var(--brand-hover);color:#fff;}
  .wa-status{display:flex;align-items:center;gap:6px;font-size:12px;color:rgba(255,255,255,.7);padding:0 4px;flex-shrink:0;}
  .wa-status .dot{width:7px;height:7px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 3px rgba(31,184,85,.25);}
  .avatar{width:28px;height:28px;border-radius:50%;background:var(--brand-soft);color:var(--brand-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11.5px;flex-shrink:0;cursor:pointer;border:1.5px solid rgba(255,255,255,.2);}

  /* ---------- BODY: submenu + workspace ---------- */
  .body{flex:1;display:flex;min-height:0;}
  aside.submenu{
    width:196px;flex-shrink:0;background:var(--paper-sunken);border-right:1px solid var(--line);
    padding:16px 10px;overflow-y:auto;
  }
  aside.submenu.hidden{display:none;}
  aside.submenu h3{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);margin:4px 8px 8px;}
  aside.submenu button{
    display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;background:none;border:none;
    font-size:13px;color:var(--ink-soft);padding:7px 10px;border-radius:var(--radius-sm);cursor:pointer;margin-bottom:1px;
    border-left:2px solid transparent;font-weight:500;
  }
  aside.submenu button:hover{background:var(--paper-recessed);color:var(--ink);}
  aside.submenu button.active{background:#fff;color:var(--ink);border-left-color:var(--brand);font-weight:700;box-shadow:var(--shadow-sm);}
  :root[data-theme="dark"] aside.submenu button.active,
  @media (prefers-color-scheme: dark){ }
  aside.submenu button.active{}
  aside.submenu button .count{font-size:11px;color:var(--ink-faint);font-weight:600;}
  aside.submenu button.active .count{color:var(--brand-ink);}

  main.workspace{flex:1;min-width:0;overflow-y:auto;background:var(--paper);}
  .screen{display:none;padding:22px 26px;}
  .screen.active{display:block;}

  .page-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;}
  .page-head h1{font-size:18px;font-weight:700;margin:0;letter-spacing:-.01em;}
  .page-head p{font-size:12.5px;color:var(--ink-soft);margin:3px 0 0;}

  /* stat strip */
  .stat-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:20px;}
  .stat{background:var(--paper);padding:14px 16px;}
  .stat .label{font-size:11px;color:var(--ink-faint);font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
  .stat .value{font-size:22px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
  .stat .delta{font-size:11.5px;margin-top:3px;font-weight:600;}
  .stat .delta.up{color:var(--success);} .stat .delta.warn{color:var(--warning);}

  .grid-2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:16px;}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px;}
  .card h2{font-size:13px;font-weight:700;margin:0 0 12px;}
  .card h2 small{font-weight:500;color:var(--ink-faint);float:right;font-size:11px;}

  .bars{display:flex;align-items:flex-end;gap:8px;height:110px;padding-top:8px;}
  .bars .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;}
  .bars .bar{width:100%;border-radius:3px 3px 0 0;background:var(--brand-soft);position:relative;}
  .bars .bar.hi{background:var(--brand);}
  .bars .bar-label{font-size:10px;color:var(--ink-faint);}

  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line);}
  td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .name-cell{display:flex;align-items:center;gap:8px;font-weight:600;}
  .mini-avatar{width:22px;height:22px;border-radius:50%;background:var(--paper-recessed);display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;color:var(--ink-soft);flex-shrink:0;}
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;}
  .badge.wait{background:#fdf1e0;color:var(--warning);} .badge.open{background:#e6f0fa;color:var(--info);}
  .badge.won{background:var(--brand-soft);color:var(--brand-ink);}
  :root[data-theme="dark"] .badge.wait{background:#3a2a10;} :root[data-theme="dark"] .badge.open{background:#122539;}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .badge.wait{background:#3a2a10;} :root:not([data-theme="light"]) .badge.open{background:#122539;}}

  /* conversas 3-pane */
  .conv-shell{display:grid;grid-template-columns:280px 1fr 260px;height:calc(100vh - 56px);}
  .conv-list{border-right:1px solid var(--line);overflow-y:auto;background:var(--paper-sunken);}
  .conv-list .search-row{padding:10px;border-bottom:1px solid var(--line);}
  .conv-list .search-row input{width:100%;border:1px solid var(--line);border-radius:var(--radius-md);padding:7px 10px;font-size:12.5px;background:var(--paper);color:var(--ink);}
  .conv-item{display:flex;gap:9px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;}
  .conv-item:hover{background:var(--paper-recessed);}
  .conv-item.active{background:#fff;box-shadow:inset 2px 0 0 var(--brand);}
  .conv-item .mini-avatar{width:34px;height:34px;font-size:11px;}
  .conv-item .meta{flex:1;min-width:0;}
  .conv-item .row1{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;}
  .conv-item .row1 time{font-weight:500;color:var(--ink-faint);font-size:10.5px;}
  .conv-item .row2{display:flex;justify-content:space-between;align-items:center;margin-top:2px;}
  .conv-item .snippet{font-size:11.5px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px;}
  .unread-dot{width:16px;height:16px;border-radius:50%;background:var(--brand);color:#06210f;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

  .chat-pane{display:flex;flex-direction:column;background:var(--paper);}
  .chat-head{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);}
  .chat-head .who{font-weight:700;font-size:13.5px;}
  .chat-head .sub{font-size:11px;color:var(--ink-faint);}
  .chat-body{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:8px;background:var(--paper-sunken);}
  .bubble{max-width:62%;padding:8px 11px;border-radius:10px;font-size:13px;line-height:1.4;}
  .bubble.in{background:#fff;border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:2px;}
  .bubble.out{background:var(--navy-900);color:#fff;align-self:flex-end;border-bottom-right-radius:2px;}
  .bubble time{display:block;font-size:9.5px;opacity:.55;margin-top:3px;text-align:right;}
  .chat-input{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);}
  .chat-input input{flex:1;border:1px solid var(--line);border-radius:var(--radius-md);padding:9px 12px;font-size:13px;background:var(--paper);color:var(--ink);}
  .chat-input button{background:var(--brand);border:none;color:#06210f;width:36px;border-radius:var(--radius-md);font-weight:700;cursor:pointer;}

  .ctx-pane{overflow-y:auto;padding:16px;border-left:1px solid var(--line);background:var(--paper-sunken);}
  .ctx-pane .contact-head{text-align:center;margin-bottom:14px;}
  .ctx-pane .contact-head .mini-avatar{width:52px;height:52px;font-size:16px;margin:0 auto 8px;}
  .ctx-pane .contact-head h3{margin:0;font-size:14px;}
  .ctx-pane .contact-head p{margin:2px 0 0;font-size:11.5px;color:var(--ink-faint);}
  .ctx-section{margin-bottom:16px;}
  .ctx-section h4{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);margin:0 0 8px;font-weight:700;}
  .ctx-row{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-bottom:1px dashed var(--line);}
  .ctx-row span:first-child{color:var(--ink-soft);}
  .ctx-row span:last-child{font-weight:600;}
  .tag{display:inline-block;font-size:10.5px;font-weight:600;background:var(--brand-soft);color:var(--brand-ink);padding:2px 8px;border-radius:99px;margin:0 4px 4px 0;}

  .preview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
  .preview-card{border:1px solid var(--line);border-radius:var(--radius-lg);padding:14px;background:var(--paper);}
  .preview-card .ph{width:100%;height:64px;border-radius:var(--radius-md);background:var(--paper-recessed);margin-bottom:10px;}
  .preview-card h4{margin:0 0 3px;font-size:13px;}
  .preview-card p{margin:0;font-size:11.5px;color:var(--ink-soft);}
  .preview-card .price{margin-top:8px;font-weight:700;font-size:13px;}

  .footnote{margin-top:24px;padding:12px 14px;border:1px dashed var(--line-strong);border-radius:var(--radius-md);font-size:11.5px;color:var(--ink-faint);}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><span class="mark">W</span>WACRM</div>
    <nav class="primary" id="primaryNav"></nav>
    <div class="top-spacer"></div>
    <div class="search">🔍 Pesquisar… <kbd>⌘K</kbd></div>
    <button class="btn-new">+ Novo</button>
    <button class="icon-btn">🔔<span class="badge"></span></button>
    <div class="wa-status"><span class="dot"></span>Conectado</div>
    <div class="avatar">AC</div>
  </header>

  <div class="body">
    <aside class="submenu" id="submenu"></aside>
    <main class="workspace" id="workspace"></main>
  </div>
</div>

<script>
const AREAS = {
  dashboard: {label:"Dashboard", icon:"", submenu:null},
  conversas: {label:"Conversas", icon:"", badge:"dot", submenu:["Todas (18)","Não lidas (5)","Pendentes (3)","Minhas (7)","Arquivadas"]},
  contactos: {label:"Contactos", submenu:["Todos (312)","Com etiqueta","Adicionados esta semana"]},
  vendas: {label:"Vendas", submenu:["Pipeline","Visitas agendadas (4)"]},
  catalogo: {label:"Catálogo", submenu:["Produtos","Estrutura da oferta","Composições","Categorias","Disponibilidade & Operações","Saúde","Integrações externas"]},
  automacao: {label:"Automação", submenu:["Regras","Fluxos","Agentes IA"]},
  campanhas: {label:"Campanhas", badge:"BETA", submenu:null},
};
const nav = document.getElementById('primaryNav');
Object.entries(AREAS).forEach(([key,a])=>{
  const b=document.createElement('button');
  b.dataset.key=key;
  b.innerHTML = a.label + (a.badge==='dot' ? ' <span class="dot"></span>' : a.badge ? ` <span class="pill">${a.badge}</span>` : '');
  b.onclick=()=>selectArea(key);
  nav.appendChild(b);
});

function selectArea(key){
  document.querySelectorAll('#primaryNav button').forEach(b=>b.classList.toggle('active', b.dataset.key===key));
  const sm = document.getElementById('submenu');
  const items = AREAS[key].submenu;
  if(!items){ sm.classList.add('hidden'); sm.innerHTML=''; }
  else {
    sm.classList.remove('hidden');
    sm.innerHTML = `<h3>${AREAS[key].label}</h3>` + items.map((it,i)=>{
      const parts = it.match(/^(.*?)(\s\(([\d,]+)\))?$/);
      return `<button class="${i===0?'active':''}">${parts[1]}${parts[2]?`<span class="count">${parts[3]}</span>`:''}</button>`;
    }).join('');
    sm.querySelectorAll('button').forEach(btn=>btn.onclick=()=>{
      sm.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
      btn.classList.add('active');
    });
  }
  renderWorkspace(key);
}

function renderWorkspace(key){
  const ws = document.getElementById('workspace');
  if(key==='dashboard'){ ws.innerHTML = DASHBOARD_HTML; return; }
  if(key==='conversas'){ ws.innerHTML = CONVERSAS_HTML; ws.querySelector('.screen').classList.add('active'); wireConvList(); return; }
  ws.innerHTML = genericPreview(key);
}

function genericPreview(key){
  const data = {
    contactos:{title:"Contactos", sub:"312 contactos · 23 novos nos últimos 7 dias", items:[
      ["Fátima Ussene","+258 84 123 4567","VIP"],["Carlos Mabjaia","+258 82 987 6543","Novo Lead"],
      ["Sara Massango","+258 84 555 1122","Cliente"],["Pedro Sitoe","+258 87 222 3344","Cliente"],
      ["Amélia Chissano","+258 84 777 8899","Novo Lead"]]},
    vendas:{title:"Pipeline · Vendas Loja", sub:"9 negócios em aberto · 312.000 MZN", items:[
      ["Kit Ginásio Completo","Fátima Ussene","45.000 MZN"],["Sapatilhas Running Pro ×2","Carlos Mabjaia","8.500 MZN"],
      ["Whey Protein 900g ×6","Sara Massango","16.800 MZN"],["Faixas de Resistência","Pedro Sitoe","1.200 MZN"]]},
    catalogo:{title:"Catálogo · Produtos", sub:"48 produtos activos · sincronização saudável", items:[
      ["Kit Ginásio Completo","LC Fitness","45.000 MZN"],["Sapatilhas Running Pro","LC Fitness","4.250 MZN"],
      ["Whey Protein 900g","LC Fitness","2.800 MZN"],["Faixas de Resistência (kit 5)","LC Fitness","1.200 MZN"]]},
    automacao:{title:"Automação · Regras", sub:"6 regras activas", items:[
      ["Boas-vindas a novo contacto","Gatilho: novo contacto","Activa"],["Resposta fora de horário","Gatilho: hora"," Activa"],
      ["Etiqueta VIP automática","Gatilho: negócio ganho","Activa"]]},
    campanhas:{title:"Campanhas", sub:"3 campanhas enviadas este mês", items:[
      ["Promoção Volta às Aulas","842 enviados · 61% lidos","Concluída"],["Novo stock Whey Protein","310 enviados · 44% lidos","Concluída"]]},
  }[key];
  return `<div class="screen active"><div class="page-head"><div><h1>${data.title}</h1><p>${data.sub}</p></div><button class="btn-new" style="background:var(--navy-900);color:#fff;">+ Novo</button></div>
  <table><thead><tr><th>Nome</th><th>Detalhe</th><th>Estado</th></tr></thead><tbody>
  ${data.items.map(r=>`<tr><td class="name-cell"><span class="mini-avatar">${r[0][0]}</span>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}
  </tbody></table>
  <div class="footnote">Protótipo de discovery — esta secção usa o mesmo shell (header + submenu contextual) que o Dashboard e as Conversas; o desenho detalhado de ecrã é feito na Fase correspondente após aprovação do template.</div>
  </div>`;
}

const DASHBOARD_HTML = `<div class="screen active">
  <div class="page-head"><div><h1>Dashboard</h1><p>LC Fitness · segunda-feira, 16 de agosto</p></div></div>
  <div class="stat-strip">
    <div class="stat"><div class="label">Conversas activas</div><div class="value">18</div><div class="delta up">▲ 4 vs. ontem</div></div>
    <div class="stat"><div class="label">Aguardando resposta</div><div class="value">5</div><div class="delta warn">2 há mais de 1h</div></div>
    <div class="stat"><div class="label">Novos contactos (7d)</div><div class="value">23</div><div class="delta up">▲ 12%</div></div>
    <div class="stat"><div class="label">Negócios em aberto</div><div class="value">312k <small style="font-size:11px;font-weight:600;color:var(--ink-faint);">MZN</small></div><div class="delta up">9 negócios</div></div>
    <div class="stat"><div class="label">Tempo médio resposta</div><div class="value">4m12s</div><div class="delta up">▼ 38s</div></div>
  </div>
  <div class="grid-2">
    <div class="card"><h2>Conversas por dia <small>últimos 7 dias</small></h2>
      <div class="bars">
        ${[12,18,9,22,15,26,18].map((v,i)=>`<div class="bar-col"><div class="bar ${i===5?'hi':''}" style="height:${v*3.5}px"></div><div class="bar-label">${['S','T','Q','Q','S','S','D'][i]}</div></div>`).join('')}
      </div>
    </div>
    <div class="card"><h2>Pipeline por estágio</h2>
      <table><tbody>
        <tr><td>Novo Lead</td><td style="text-align:right;font-weight:700;">3</td></tr>
        <tr><td>Qualificado</td><td style="text-align:right;font-weight:700;">2</td></tr>
        <tr><td>Proposta enviada</td><td style="text-align:right;font-weight:700;">2</td></tr>
        <tr><td>Negociação</td><td style="text-align:right;font-weight:700;">1</td></tr>
        <tr><td>Ganho (mês)</td><td style="text-align:right;font-weight:700;color:var(--brand-ink);">4</td></tr>
      </tbody></table>
    </div>
  </div>
  <div class="card">
    <h2>Precisa da tua atenção</h2>
