<title>Premium CRM</title>
<style>
  :root{
    --navy-950:#070d16; --navy-900:#0b1220; --navy-850:#0f1a2c; --navy-800:#152238; --navy-700:#1c2f4a;
    --ink:#0e1522; --ink-soft:#5a6579; --ink-faint:#8994a6;
    --paper:#fbfcfd; --paper-sunken:#f2f4f7; --paper-recessed:#eaedf2; --paper-card:#ffffff;
    --line:#e4e8ee; --line-strong:#ccd3dd;
    --brand:#22c55e; --brand-glow:#25d366; --brand-deep:#0d9488; --brand-soft:#e8faf0; --brand-ink:#0a7d43;
    --success:#1f9254; --warning:#c07f0a; --danger:#d1433f; --info:#2f7fc4;
    --radius-md:10px; --radius-lg:14px; --radius-xl:18px;
    --shadow-md:0 8px 24px rgba(11,18,32,.08); --shadow-lg:0 16px 40px rgba(11,18,32,.14);
    --font: ui-sans-serif,"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
    --font-mono: ui-monospace,"SF Mono","Cascadia Code",Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#eef1f6; --ink-soft:#9aa4b6; --ink-faint:#65718a;
      --paper:#0a0f18; --paper-sunken:#0e1520; --paper-recessed:#131b28; --paper-card:#101826;
      --line:#212c3d; --line-strong:#2b3850;
      --brand-soft:#0d2a1d; --brand-ink:#57d98d;
      --shadow-md:0 8px 24px rgba(0,0,0,.35); --shadow-lg:0 16px 40px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --ink:#eef1f6; --ink-soft:#9aa4b6; --ink-faint:#65718a;
    --paper:#0a0f18; --paper-sunken:#0e1520; --paper-recessed:#131b28; --paper-card:#101826;
    --line:#212c3d; --line-strong:#2b3850;
    --brand-soft:#0d2a1d; --brand-ink:#57d98d;
    --shadow-md:0 8px 24px rgba(0,0,0,.35); --shadow-lg:0 16px 40px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  button{font-family:inherit;}
  .app{display:flex;flex-direction:column;height:100vh;}

  header.top{
    background:linear-gradient(180deg,var(--navy-850),var(--navy-950));
    color:#fff; display:flex; align-items:center; gap:22px; padding:0 22px; height:58px; flex-shrink:0;
    position:sticky; top:0; z-index:30; border-bottom:1px solid rgba(255,255,255,.06);
  }
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:14.5px;letter-spacing:.02em;flex-shrink:0;}
  .brand .mark{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,var(--brand-glow),var(--brand-deep));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#04140c;box-shadow:0 0 12px rgba(37,211,102,.5);}
  nav.primary{display:flex;align-items:center;gap:4px;height:100%;}
  nav.primary button{
    background:none;border:none;color:rgba(255,255,255,.6);font-size:12.5px;font-weight:700;letter-spacing:.03em;
    padding:0 14px;height:100%;cursor:pointer;position:relative;display:flex;align-items:center;gap:6px;
  }
  nav.primary button::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:2px;background:transparent;border-radius:2px;transition:all .15s;}
  nav.primary button:hover{color:#fff;}
  nav.primary button.active{color:#fff;}
  nav.primary button.active::after{background:var(--brand-glow);box-shadow:0 0 10px rgba(37,211,102,.8);}
  nav.primary button .dot{width:6px;height:6px;border-radius:50%;background:var(--brand-glow);box-shadow:0 0 6px rgba(37,211,102,.9);}
  nav.primary button .pill{background:rgba(255,255,255,.12);color:#fff;font-size:9.5px;font-weight:800;padding:1px 6px;border-radius:99px;}
  .top-spacer{flex:1;}
  .search{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:var(--radius-md);padding:6px 11px;color:rgba(255,255,255,.5);font-size:12px;width:210px;flex-shrink:0;}
  .search kbd{margin-left:auto;font-family:var(--font-mono);font-size:9.5px;background:rgba(255,255,255,.1);padding:1px 5px;border-radius:4px;}
  .icon-btn{width:32px;height:32px;border-radius:var(--radius-md);border:none;background:transparent;color:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;flex-shrink:0;}
  .icon-btn:hover{background:rgba(255,255,255,.08);color:#fff;}
  .icon-btn .badge{position:absolute;top:3px;right:3px;width:7px;height:7px;background:#ef5350;border-radius:50%;border:1.5px solid var(--navy-950);}
  .btn-new{background:linear-gradient(135deg,var(--brand-glow),var(--brand-deep));color:#04140c;border:none;font-weight:800;font-size:12.5px;padding:7px 13px;border-radius:var(--radius-md);cursor:pointer;flex-shrink:0;box-shadow:0 2px 10px rgba(37,211,102,.3);}
  .wa-status{display:flex;align-items:center;gap:6px;font-size:11.5px;color:rgba(255,255,255,.65);flex-shrink:0;}
  .wa-status .dot{width:7px;height:7px;border-radius:50%;background:var(--brand-glow);box-shadow:0 0 8px rgba(37,211,102,.8);}
  .avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--brand-soft),#fff);color:var(--brand-ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11.5px;flex-shrink:0;cursor:pointer;border:1.5px solid rgba(255,255,255,.15);}

  .body{flex:1;display:flex;min-height:0;}
  aside.submenu{width:200px;flex-shrink:0;background:var(--paper-sunken);border-right:1px solid var(--line);padding:18px 12px;overflow-y:auto;}
  aside.submenu.hidden{display:none;}
  aside.submenu h3{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-faint);margin:4px 6px 10px;}
  aside.submenu button{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;background:none;border:none;font-size:13px;color:var(--ink-soft);padding:8px 10px;border-radius:var(--radius-md);cursor:pointer;margin-bottom:2px;font-weight:600;}
  aside.submenu button:hover{background:var(--paper-recessed);color:var(--ink);}
  aside.submenu button.active{background:var(--paper-card);color:var(--ink);box-shadow:var(--shadow-md);font-weight:700;}
  aside.submenu button.active .count{color:var(--brand-ink);}
  aside.submenu button .count{font-size:11px;color:var(--ink-faint);font-weight:700;}

  main.workspace{flex:1;min-width:0;overflow-y:auto;background:var(--paper);}
  .screen{display:none;padding:24px 28px;}
  .screen.active{display:block;}
  .page-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:20px;}
  .page-head h1{font-size:21px;font-weight:800;margin:0;letter-spacing:-.02em;}
  .page-head p{font-size:12.5px;color:var(--ink-soft);margin:4px 0 0;}

  .stat-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px;}
  .stat{background:var(--paper-card);border-radius:var(--radius-xl);padding:16px 16px 12px;box-shadow:var(--shadow-md);}
  .stat .label{font-size:10.5px;color:var(--ink-faint);font-weight:700;text-transform:uppercase;letter-spacing:.05em;}
  .stat .value{font-size:25px;font-weight:800;margin-top:5px;font-variant-numeric:tabular-nums;letter-spacing:-.03em;}
  .stat .delta{font-size:11px;margin-top:2px;font-weight:700;}
  .stat .delta.up{color:var(--success);} .stat .delta.warn{color:var(--warning);}
  .stat svg{margin-top:8px;display:block;}

  .grid-2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:16px;}
  .card{background:var(--paper-card);border-radius:var(--radius-xl);padding:18px;box-shadow:var(--shadow-md);}
  .card h2{font-size:13.5px;font-weight:800;margin:0 0 14px;}
  .card h2 small{font-weight:600;color:var(--ink-faint);float:right;font-size:11px;}

  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);font-weight:700;padding:7px 8px;border-bottom:1px solid var(--line);}
  td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .name-cell{display:flex;align-items:center;gap:9px;font-weight:700;}
  .mini-avatar{width:26px;height:26px;border-radius:50%;background:var(--paper-recessed);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--ink-soft);flex-shrink:0;}
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;}
  .badge.wait{background:#fbeed7;color:var(--warning);} .badge.open{background:#e3eefa;color:var(--info);}
  .badge.won{background:var(--brand-soft);color:var(--brand-ink);}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .badge.wait{background:#3a2a10;} :root:not([data-theme="light"]) .badge.open{background:#122539;}}
  :root[data-theme="dark"] .badge.wait{background:#3a2a10;} :root[data-theme="dark"] .badge.open{background:#122539;}

  .conv-shell{display:grid;grid-template-columns:290px 1fr 280px;height:calc(100vh - 58px);}
  .conv-list{border-right:1px solid var(--line);overflow-y:auto;background:var(--paper-sunken);}
  .conv-list .search-row{padding:12px;}
  .conv-list .search-row input{width:100%;border:1px solid var(--line);border-radius:var(--radius-md);padding:8px 11px;font-size:12.5px;background:var(--paper-card);color:var(--ink);}
  .conv-item{display:flex;gap:10px;padding:11px 13px;cursor:pointer;border-radius:var(--radius-lg);margin:0 8px 4px;}
  .conv-item:hover{background:var(--paper-recessed);}
  .conv-item.active{background:var(--paper-card);box-shadow:var(--shadow-md);}
  .conv-item .mini-avatar{width:36px;height:36px;font-size:12px;}
  .conv-item .meta{flex:1;min-width:0;}
  .conv-item .row1{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;}
  .conv-item .row1 time{font-weight:600;color:var(--ink-faint);font-size:10.5px;}
  .conv-item .row2{display:flex;justify-content:space-between;align-items:center;margin-top:2px;}
  .conv-item .snippet{font-size:11.5px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px;}
  .unread-dot{width:17px;height:17px;border-radius:50%;background:var(--brand-glow);color:#04140c;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

  .chat-pane{display:flex;flex-direction:column;background:var(--paper);}
  .chat-head{display:flex;align-items:center;gap:10px;padding:11px 18px;border-bottom:1px solid var(--line);background:var(--paper-card);}
  .chat-head .who{font-weight:800;font-size:13.5px;}
  .chat-head .sub{font-size:11px;color:var(--ink-faint);}
  .chat-body{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:8px;background:var(--paper-sunken);}
  .bubble{max-width:58%;padding:9px 12px;border-radius:14px;font-size:13px;line-height:1.45;box-shadow:0 1px 3px rgba(11,18,32,.06);}
  .bubble.in{background:var(--paper-card);align-self:flex-start;border-bottom-left-radius:3px;}
  .bubble.out{background:linear-gradient(135deg,var(--navy-800),var(--navy-900));color:#fff;align-self:flex-end;border-bottom-right-radius:3px;}
  .bubble time{display:block;font-size:9.5px;opacity:.55;margin-top:4px;text-align:right;}
  .chat-input{display:flex;gap:8px;padding:13px 18px;border-top:1px solid var(--line);background:var(--paper-card);}
  .chat-input input{flex:1;border:1px solid var(--line);border-radius:var(--radius-md);padding:9px 13px;font-size:13px;background:var(--paper);color:var(--ink);}
  .chat-input button{background:linear-gradient(135deg,var(--brand-glow),var(--brand-deep));border:none;color:#04140c;width:38px;border-radius:var(--radius-md);font-weight:800;cursor:pointer;}

  .ctx-pane{overflow-y:auto;padding:18px;border-left:1px solid var(--line);background:var(--paper-sunken);}
  .ctx-card{background:var(--paper-card);border-radius:var(--radius-xl);box-shadow:var(--shadow-md);padding:16px;margin-bottom:14px;}
  .ctx-pane .contact-head{text-align:center;}
  .ctx-pane .contact-head .mini-avatar{width:56px;height:56px;font-size:17px;margin:0 auto 10px;position:relative;}
  .ctx-pane .contact-head h3{margin:0;font-size:14.5px;}
  .ctx-pane .contact-head p{margin:2px 0 0;font-size:11px;color:var(--ink-faint);}
  .ctx-section h4{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);margin:0 0 10px;font-weight:800;}
  .ctx-row{display:flex;justify-content:space-between;font-size:12px;padding:6px 0;}
  .ctx-row span:first-child{color:var(--ink-soft);}
  .ctx-row span:last-child{font-weight:700;}
  .tag{display:inline-block;font-size:10.5px;font-weight:700;background:var(--brand-soft);color:var(--brand-ink);padding:3px 10px;border-radius:99px;margin:0 5px 5px 0;}
  .progress{height:5px;border-radius:99px;background:var(--paper-recessed);margin-top:10px;overflow:hidden;}
  .progress > div{height:100%;background:linear-gradient(90deg,var(--brand-glow),var(--brand-deep));border-radius:99px;}

  .preview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
  .footnote{margin-top:26px;padding:13px 16px;background:var(--paper-card);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);font-size:11.5px;color:var(--ink-faint);}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><span class="mark">W</span>WACRM</div>
    <nav class="primary" id="primaryNav"></nav>
    <div class="top-spacer"></div>
    <div class="search">🔍 Pesquisar… <kbd>⌘K</kbd></div>
    <button class="btn-new">+ Novo</button>
    <button class="icon-btn">🔔<span class="badge"></span></button>
    <div class="wa-status"><span class="dot"></span>Conectado</div>
    <div class="avatar">AC</div>
  </header>
  <div class="body">
    <aside class="submenu" id="submenu"></aside>
    <main class="workspace" id="workspace"></main>
  </div>
</div>

<script>
const AREAS = {
  dashboard: {label:"Dashboard", submenu:null},
  conversas: {label:"Conversas", badge:"dot", submenu:["Todas (18)","Não lidas (5)","Pendentes (3)","Minhas (7)","Arquivadas"]},
  contactos: {label:"Contactos", submenu:["Todos (312)","Com etiqueta","Adicionados esta semana"]},
  vendas: {label:"Vendas", submenu:["Pipeline","Visitas agendadas (4)"]},
  catalogo: {label:"Catálogo", submenu:["Produtos","Estrutura da oferta","Composições","Categorias","Disponibilidade & Operações","Saúde","Integrações externas"]},
  automacao: {label:"Automação", submenu:["Regras","Fluxos","Agentes IA"]},
  campanhas: {label:"Campanhas", badge:"BETA", submenu:null},
};
const nav = document.getElementById('primaryNav');
Object.entries(AREAS).forEach(([key,a])=>{
  const b=document.createElement('button');
  b.dataset.key=key;
  b.innerHTML = a.label + (a.badge==='dot' ? ' <span class="dot"></span>' : a.badge ? ` <span class="pill">${a.badge}</span>` : '');
  b.onclick=()=>selectArea(key);
  nav.appendChild(b);
});

function selectArea(key){
  document.querySelectorAll('#primaryNav button').forEach(b=>b.classList.toggle('active', b.dataset.key===key));
  const sm = document.getElementById('submenu');
  const items = AREAS[key].submenu;
  if(!items){ sm.classList.add('hidden'); sm.innerHTML=''; }
  else {
    sm.classList.remove('hidden');
    sm.innerHTML = `<h3>${AREAS[key].label}</h3>` + items.map((it,i)=>{
      const parts = it.match(/^(.*?)(\s\(([\d,]+)\))?$/);
      return `<button class="${i===0?'active':''}">${parts[1]}${parts[2]?`<span class="count">${parts[3]}</span>`:''}</button>`;
    }).join('');
    sm.querySelectorAll('button').forEach(btn=>btn.onclick=()=>{
      sm.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
      btn.classList.add('active');
    });
  }
  renderWorkspace(key);
}

function sparkline(values, color){
  const w=140,h=34,pad=3;
  const max=Math.max(...values), min=Math.min(...values);
  const pts = values.map((v,i)=>{
    const x = pad + (i/(values.length-1))*(w-pad*2);
    const y = h-pad - ((v-min)/(max-min||1))*(h-pad*2);
    return [x,y];
  });
  const line = pts.map(p=>p.join(',')).join(' ');
  const area = `${pad},${h-pad} ` + line + ` ${w-pad},${h-pad}`;
  const last = pts[pts.length-1];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="currentColor" stroke-opacity=".08"/>
    <polygon points="${area}" fill="${color}" fill-opacity=".14"/>
    <polyline points="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="2.75" fill="${color}"/>
  </svg>`;
}

function renderWorkspace(key){
  const ws = document.getElementById('workspace');
  if(key==='dashboard'){ ws.innerHTML = DASHBOARD_HTML(); return; }
  if(key==='conversas'){ ws.innerHTML = CONVERSAS_HTML; return; }
  ws.innerHTML = genericPreview(key);
}

function genericPreview(key){
  const data = {
    contactos:{title:"Contactos", sub:"312 contactos · 23 novos nos últimos 7 dias", items:[
      ["Fátima Ussene","+258 84 123 4567","VIP"],["Carlos Mabjaia","+258 82 987 6543","Novo Lead"],
      ["Sara Massango","+258 84 555 1122","Cliente"],["Pedro Sitoe","+258 87 222 3344","Cliente"],
      ["Amélia Chissano","+258 84 777 8899","Novo Lead"]]},
    vendas:{title:"Pipeline · Vendas Loja", sub:"9 negócios em aberto · 312.000 MZN", items:[
      ["Kit Ginásio Completo","Fátima Ussene","45.000 MZN"],["Sapatilhas Running Pro ×2","Carlos Mabjaia","8.500 MZN"],
      ["Whey Protein 900g ×6","Sara Massango","16.800 MZN"],["Faixas de Resistência","Pedro Sitoe","1.200 MZN"]]},
    catalogo:{title:"Catálogo · Produtos", sub:"48 produtos activos · sincronização saudável", items:[
      ["Kit Ginásio Completo","LC Fitness","45.000 MZN"],["Sapatilhas Running Pro","LC Fitness","4.250 MZN"],
      ["Whey Protein 900g","LC Fitness","2.800 MZN"],["Faixas de Resistência (kit 5)","LC Fitness","1.200 MZN"]]},
    automacao:{title:"Automação · Regras", sub:"6 regras activas", items:[
      ["Boas-vindas a novo contacto","Gatilho: novo contacto","Activa"],["Resposta fora de horário","Gatilho: hora","Activa"],
      ["Etiqueta VIP automática","Gatilho: negócio ganho","Activa"]]},
    campanhas:{title:"Campanhas", sub:"3 campanhas enviadas este mês", items:[
      ["Promoção Volta às Aulas","842 enviados · 61% lidos","Concluída"],["Novo stock Whey Protein","310 enviados · 44% lidos","Concluída"]]},
  }[key];
  return `<div class="screen active"><div class="page-head"><div><h1>${data.title}</h1><p>${data.sub}</p></div><button class="btn-new" style="background:linear-gradient(135deg,var(--navy-800),var(--navy-900));color:#fff;">+ Novo</button></div>
  <div class="card"><table><thead><tr><th>Nome</th><th>Detalhe</th><th>Estado</th></tr></thead><tbody>
  ${data.items.map(r=>`<tr><td class="name-cell"><span class="mini-avatar">${r[0][0]}</span>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}
  </tbody></table></div>
  <div class="footnote">Protótipo de discovery — mesmo shell (header + submenu contextual) do Dashboard/Conversas; ecrã detalhado desenhado na fase correspondente após aprovação.</div>
  </div>`;
}

function DASHBOARD_HTML(){
return `<div class="screen active">
  <div class="page-head"><div><h1>Dashboard</h1><p>LC Fitness · segunda-feira, 16 de agosto</p></div></div>
  <div class="stat-strip">
    <div class="stat"><div class="label">Conversas activas</div><div class="value">18</div><div class="delta up">▲ 4 vs. ontem</div>${sparkline([9,11,10,14,12,16,18],'#22c55e')}</div>
    <div class="stat"><div class="label">Aguardando resposta</div><div class="value">5</div><div class="delta warn">2 há mais de 1h</div>${sparkline([3,4,2,5,3,6,5],'#c07f0a')}</div>
    <div class="stat"><div class="label">Novos contactos (7d)</div><div class="value">23</div><div class="delta up">▲ 12%</div>${sparkline([12,14,15,17,19,21,23],'#22c55e')}</div>
    <div class="stat"><div class="label">Negócios em aberto</div><div class="value">312k</div><div class="delta up">9 negócios</div>${sparkline([210,240,260,280,300,305,312],'#22c55e')}</div>
    <div class="stat"><div class="label">Tempo médio resposta</div><div class="value">4m12s</div><div class="delta up">▼ 38s</div>${sparkline([6,5.5,5,4.8,4.5,4.3,4.2],'#22c55e')}</div>
  </div>
